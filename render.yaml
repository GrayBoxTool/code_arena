services:
  - type: web
    name: code-rumble-api
    runtime: python
    plan: free
    buildCommand: "python -m compileall -q ."
    startCommand: "python server.py"
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ACCESS_SEED
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2.5-flare
      - key: OPENAI_API_KEY
        sync: false
      - key: JUDGE_PROVIDER
        value: openai
      - key: OPENAI_JUDGE_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
