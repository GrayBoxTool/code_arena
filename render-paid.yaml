# Optional long-term data storage. To use this, copy this file over render.yaml.
services:
  - type: web
    name: code-rumble-api
    runtime: python
    plan: starter
    buildCommand: "python -m compileall -q ."
    startCommand: "python server.py"
    healthCheckPath: /
    disk:
      name: rumble-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: RUMBLE_DATA_DIR
        value: /var/data
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ACCESS_SEED
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2.5-flare
      - key: OPENAI_API_KEY
        sync: false
      - key: JUDGE_PROVIDER
        value: openai
      - key: OPENAI_JUDGE_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
