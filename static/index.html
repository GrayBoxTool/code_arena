<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101727">
  <meta name="description" content="5팀 알고리즘 대회 프로토타입">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <title>CODE RUMBLE — 알고리즘 대회</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">CR<span class="mark-slash">/</span></span><span>CODE RUMBLE <small>ALGORITHM ARENA</small></span></div>
    <div id="identity" class="identity">프로토타입</div>
  </header>
  <main id="app">
    <section class="login panel">
      <div class="eyebrow">5 TEAMS · 25 PLAYERS · 35 PROBLEMS</div>
      <h1>경기에 입장하세요.</h1>
      <p>운영자 또는 선수 참가 코드를 입력하면 해당 화면이 열립니다.</p>
      <form id="login-form">
        <label for="token">참가 코드</label>
        <div class="login-row"><input id="token" type="password" required autocomplete="off" placeholder="운영자에게 받은 참가 코드"><button type="submit" class="primary">입장</button></div>
      </form>
      <p class="login-note">참가 코드는 운영자에게 개인별로 받으세요.</p>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/editor.js" defer></script>
  <script src="/config.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
