<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101727">
  <meta name="description" content="Code Rumble 계정·랭크·알고리즘 게임 로비">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <title>CODE RUMBLE — 알고리즘 대회</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">CR<span class="mark-slash">/</span></span><span>CODE RUMBLE <small>ALGORITHM ARENA</small></span></div>
    <div id="identity" class="identity">프로토타입</div>
  </header>
  <main id="app">
    <section class="auth-card login panel">
      <div class="eyebrow">CODE RUMBLE · ALGORITHM ARENA</div>
      <h1>로그인</h1>
      <p>계정으로 로그인해 게임 로비와 랭크 매칭을 이용하세요.</p>
      <form id="login-form"><label>아이디<input name="username" autocomplete="username" maxlength="20" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" maxlength="20" required></label><button class="primary">로그인</button></form>
      <div class="auth-links"><button data-auth="register">계정 생성</button><button data-recover="username">아이디 찾기</button><button data-recover="password">비밀번호 찾기</button></div>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/editor.js" defer></script>
  <script src="/config.js" defer></script>
  <script src="/ui_state.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
